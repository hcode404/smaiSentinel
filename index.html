        <h2 style="font-size:1.2rem">שלב 3 — כללי אבטחה</h2>
        <p class="mute small">הדביקו ב-Firestore ← Rules ← Publish. הכללים מגבילים כל פעולה לפי דרגת המשתמש
          (<span class="mono">rankLvl</span> נשמר בפרופיל), כך שגם מי שיערוך את קוד הדף לא יוכל לעקוף אותם.</p>
        <div class="code-box" style="max-height:340px;overflow:auto">
          <button class="copy" id="cpRules">${ic('copy',14)} העתקה</button><pre id="rulesTxt">${esc(RULES)}</pre></div>
        <div class="callout c-warn" style="margin-top:14px"><span class="ic">${ic('alert',18)}</span>
          <div>אל תשכחו: אחרי שינוי דרגה של משתמש, המערכת מעדכנת גם <span class="mono">rankLvl</span>.
            זה השדה שהכללים בודקים.</div></div>
      </div>
    </div>

    <div class="stack" style="gap:16px">
      <div class="card">
        <h3 style="margin-top:0">המנהל הראשון</h3>
        <p class="small mute">המשתמש הראשון שנרשם במצב הדגמה הופך אוטומטית למייסד. ב-Firebase,
          היכנסו ל-Firestore ← <span class="mono">users</span> ← המסמך שלכם, ושנו ידנית:</p>
        <div class="code-box"><pre>rank: "founder"
rankLvl: 70</pre></div>
        <p class="small mute">מאותו רגע אפשר לנהל דרגות של כולם מתוך הפאנל.</p>
      </div>

      <div class="card">
        <h3 style="margin-top:0">מבנה הנתונים</h3>
        <ul class="ticks small">
          ${[['users','פרופילים, דרגות, הרחקות והשתקות'],['tickets','פניות ודיווחים'],['messages','שיחה בתוך פנייה'],
             ['servers','שרתי הקהילה'],['cmsgs','הודעות בשרתים'],['reports','דיווחים על הודעות'],
             ['modlog','יומן פעולות מודרציה'],['appeals','ערעורים על הרחקות'],
             ['applications','מועמדויות לצוות'],['articles','מדריכים נוספים']]
            .map(x=>`<li><span class="mono">${x[0]}</span> — ${x[1]}</li>`).join('')}
        </ul>
      </div>

      <div class="card">
        <h3 style="margin-top:0">התאמה אישית</h3>
        <p class="small mute">בראש הקובץ יש בלוק <span class="mono">SITE</span> — שם, סלוגן, אימייל ויעד זמן התגובה.
          המחלקות מוגדרות ב-<span class="mono">DEPTS</span>, הדרגות ב-<span class="mono">RANKS</span>
          וההרשאות ב-<span class="mono">CAP</span>. הצבעים — במשתני ה-CSS בראש הקובץ.</p>
      </div>

      ${admin?`<div class="card">
        <h3 style="margin-top:0">כלים מהירים</h3>
        <button class="btn btn-g btn-sm btn-block" id="expAll">${ic('copy',15)} ייצוא כל הנתונים ל-JSON</button>
        ${!FB_ON?`<button class="btn btn-g btn-sm btn-block" style="margin-top:8px" id="seedBtn">${ic('sparkle',15)} טעינת תוכן הדגמה מחדש</button>
        <button class="btn btn-ghost btn-sm btn-block" style="margin-top:8px;color:var(--danger)" id="wipeBtn">${ic('trash',15)} איפוס מסד ההדגמה</button>`:''}
      </div>`:''}
    </div>
  </div>`;

  $('#cpCfg').onclick = ()=>copyText($('#cfgTxt').textContent, 'הקוד הועתק');
  $('#cpRules').onclick = ()=>copyText($('#rulesTxt').textContent, 'כללי האבטחה הועתקו');
  const ex = $('#expAll');
  if(ex) ex.onclick = async ()=>{
    const cols = ['users','tickets','messages','servers','cmsgs','reports','modlog','appeals','applications','articles'];
    const out = {};
    for(const c of cols) out[c] = await Store.list(c);
    const blob = new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `smai-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast('הגיבוי הורד');
  };
  const sb = $('#seedBtn');
  if(sb) sb.onclick = async ()=>{ localStorage.removeItem('smai_seeded_v2'); await seedDemo(true); toast('תוכן ההדגמה נטען מחדש'); };
  const wb = $('#wipeBtn');
  if(wb) wb.onclick = async ()=>{
    if(!await confirmBox('לאפס את כל נתוני ההדגמה?','הפעולה תמחק את כל הפניות, ההודעות והמשתמשים שנשמרו בדפדפן הזה. אין דרך חזרה.')) return;
    localStorage.removeItem(LS_KEY); localStorage.removeItem('smai_seeded_v2'); localStorage.removeItem('smai_uid');
    toast('המסד אופס'); setTimeout(()=>location.reload(), 700);
  };
});

/* ===================== ראוטר ===================== */
let RENDERING = false;
async function render(){
  if(RENDERING) return; RENDERING = true;
  runCleanup();
  const app = $('#app');
  const hash = (location.hash || '#/').replace(/^#/, '');
  const parts = hash.split('/').filter(Boolean);
  const path = '/' + (parts[0] || '');
  const arg = parts[1] ? decodeURIComponent(parts[1]) : null;

  renderNav();
  document.body.classList.toggle('is-auth', path === '/login');

  // חסימת מורחקים מכל האתר למעט מסכי מידע
  if(Auth.user && Auth.banInfo() && !['/privacy','/login','/'].includes(path)){
    window.scrollTo({top:0}); if(renderBanned(app)){ RENDERING = false; return; }
  }

  const fn = ROUTES[path] || ROUTES['/404'];
  app.innerHTML = loader();
  try{ await fn(app, arg); }
  catch(e){
    console.error(e);
    app.innerHTML = `<div class="card center" style="max-width:520px;margin:50px auto">
      <div class="ico-tile i-dang" style="margin:0 auto 14px;width:56px;height:56px">${ic('alert',24)}</div>
      <h2 style="font-size:1.25rem">משהו השתבש בטעינת העמוד</h2>
      <p class="mute small">${esc(e.message||'שגיאה לא ידועה')}</p>
      <div class="row" style="justify-content:center"><button class="btn btn-g" onclick="location.reload()">רענון</button>
        <a class="btn btn-p" href="#/">לדף הבית</a></div></div>`;
  }
  document.title = (PAGE_TITLES[path] ? PAGE_TITLES[path] + ' · ' : '') + SITE.name + ' — ' + SITE.tagline;
  initReveal();
  RENDERING = false;
}
const PAGE_TITLES = {
  '/report':'דיווח חדש', '/my':'הפניות שלי', '/track':'מעקב פנייה', '/ticket':'פנייה',
  '/articles':'מדריכים', '/article':'מדריך', '/community':'קהילה', '/server':'שרת קהילה',
  '/join':'הצטרפות לצוות', '/login':'כניסה', '/account':'החשבון שלי', '/admin':'פאנל צוות',
  '/setup':'התקנה', '/privacy':'פרטיות', '/404':'לא נמצא'
};

/* ===================== ערכת נושא, תפריט, אתחול ===================== */
function initTheme(){
  const saved = localStorage.getItem('smai_theme');
  const sys = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  const set = t=>{
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('smai_theme', t);
    const b = $('#themeBtn'); if(b) b.innerHTML = ic(t==='dark'?'sun':'moon',18);
  };
  set(saved || sys);
  $('#themeBtn').onclick = ()=>set(document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark');
}
function initBurger(){
  const b = $('#burger'), nav = $('#nav');
  b.onclick = ()=>{ nav.classList.toggle('open'); b.classList.toggle('on'); };
  nav.addEventListener('click', e=>{ if(e.target.tagName==='A'){ nav.classList.remove('open'); b.classList.remove('on'); } });
}
function initNotif(){
  $('#notifBtn').onclick = async ()=>{
    if(!Auth.user) return toast('התחברו כדי לראות עדכונים','warn');
    const [tickets, appeals] = await Promise.all([Store.list('tickets'), Store.list('appeals')]);
    const mine = tickets.filter(t=>t.userId===Auth.user.id).slice(0,6);
    const staff = Auth.can('viewPanel')
      ? tickets.filter(t=>t.status==='new' || (t.priority==='critical' && !['resolved','closed'].includes(t.status))).slice(0,6)
      : [];
    const row = t=>`<a class="ch" href="#/ticket/${t.id}" onclick="closeModal()">
      ${ic('file',16)}<span class="nm">${esc(t.title)}</span>${statusBadge(t.status)}</a>`;
    openModal(`<div class="m-h"><span class="ico-tile i-brand">${ic('bell',20)}</span><h3>עדכונים</h3></div>
    <div class="m-b" style="padding:14px">
      ${staff.length?`<h4 class="small mute" style="margin:0 0 8px">דורש טיפול</h4>
        <div class="stack" style="gap:4px;margin-bottom:16px">${staff.map(row).join('')}</div>`:''}
      <h4 class="small mute" style="margin:0 0 8px">הפניות שלי</h4>
      ${mine.length?`<div class="stack" style="gap:4px">${mine.map(row).join('')}</div>`
        :'<p class="small mute">אין פניות פתוחות. זה דווקא סימן טוב.</p>'}
      ${Auth.can('ban') && appeals.filter(a=>a.status==='pending').length
        ? `<div class="callout c-warn" style="margin-top:14px"><span class="ic">${ic('message',17)}</span>
           <div>${appeals.filter(a=>a.status==='pending').length} ערעורים ממתינים לבדיקה.
           <a href="#/admin" onclick="closeModal()">לפאנל</a></div></div>` : ''}
    </div>`);
  };
}
function initDemoStrip(){
  const el = $('#demoStrip');
  if(FB_ON){ el.style.display = 'none'; return; }
  el.innerHTML = `<div class="wrap row" style="gap:9px;justify-content:center;flex-wrap:wrap">
    ${ic('info',15)}<b>מצב הדגמה.</b> הנתונים נשמרים בדפדפן הזה בלבד —
    <a href="#/setup">חברו את האתר ל-Firebase</a> כדי לעבוד באמת.</div>`;
}

/* זריעת תוכן הדגמה */
async function seedDemo(force){
  if(FB_ON) return;
  if(!force && localStorage.getItem('smai_seeded_v2')) return;
  // השרתים הרשמיים מוגדרים בקוד ותמיד קיימים — זורעים רק הודעות פתיחה
  const msgs = await Store.list('cmsgs');
  if(!msgs.length || force){
    const t0 = Date.now() - SEED_MSGS.length * 9e5;
    for(let i=0;i<SEED_MSGS.length;i++){
      const m = SEED_MSGS[i];
      await Store.add('cmsgs', { server:m.server, text:m.text, senderId:'seed-'+i,
        senderName:m.name, senderRank:m.rank, seeded:true,
        createdAt: new Date(t0 + i*9e5).toISOString() });
    }
  }
  localStorage.setItem('smai_seeded_v2','1');
}

/* אתחול */
(async function boot(){
  initTheme(); initBurger(); initNotif(); initDemoStrip(); renderFooter();
  try{ await initFirebase(); }catch(e){ console.warn('Firebase init failed, falling back to local mode', e); }
  try{ await seedDemo(false); }catch(e){ console.warn('seed failed', e); }
  try{ window.__SRV_CACHE = await Store.list('servers'); }catch(e){}
  window.addEventListener('hashchange', ()=>{ window.scrollTo({top:0,behavior:'instant'}); render(); });
  if(!location.hash) location.hash = '#/';
  await render();
  document.body.classList.add('ready');
})();
</script>
